<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaszGame: Maze Saga (50+ Levels)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            background-color: #0c0a09;
            color: #f5f5f4;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Organic Glass Panel */
        .glass-panel {
            background: rgba(24, 20, 17, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(217, 119, 6, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .btn-organic {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            transition: all 0.2s ease;
        }

        .btn-organic:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.6);
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .btn-organic:active {
            transform: translateY(1px);
        }

        /* Minimap Styling */
        #minimap-canvas {
            border: 2px solid rgba(217, 119, 6, 0.5);
            border-radius: 12px;
            background: rgba(12, 10, 9, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(28, 25, 23, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }

        /* Touch D-Pad */
        .dpad-btn {
            background: rgba(44, 36, 32, 0.85);
            border: 1px solid rgba(217, 119, 6, 0.4);
            color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            transition: background 0.1s;
        }

        .dpad-btn:active {
            background: rgba(217, 119, 6, 0.6);
            color: #ffffff;
        }

        .level-card {
            transition: all 0.2s ease;
        }
        .level-card:hover:not(.locked) {
            transform: scale(1.05);
            border-color: #f59e0b;
        }
    </style>
</head>
<body class="relative w-full h-full bg-stone-950 overflow-hidden">

    <!-- WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay Layer -->
    <div id="ui-container" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-3 md:p-6">
        
        <!-- TOP HUD -->
        <div id="hud" class="w-full flex justify-between items-start opacity-0 transition-opacity duration-500">
            <!-- Left Info: Level & Realm -->
            <div class="flex flex-col gap-2">
                <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3">
                    <i id="theme-icon" class="fa-solid fa-synagogue text-amber-500 text-xl"></i>
                    <div>
                        <div id="hud-level-title" class="text-xs font-cinzel font-bold text-amber-400 uppercase tracking-wider">PERINGKAT 1</div>
                        <div id="hud-realm-name" class="text-sm font-extrabold text-stone-100">Kuil Purba</div>
                    </div>
                </div>

                <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3">
                    <i id="item-icon" class="fa-solid fa-key text-amber-400 text-xl animate-pulse"></i>
                    <div>
                        <div class="text-xs font-cinzel text-stone-400 font-bold uppercase">Kunci Artifak</div>
                        <div class="text-base font-extrabold text-stone-100">
                            <span id="hud-items-collected">0</span> / <span id="hud-items-total">1</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Info: Hazard Warning -->
            <div id="hazard-warning" class="hidden glass-panel px-4 py-1.5 rounded-full border-rose-500/50 flex items-center gap-2 animate-bounce">
                <i class="fa-solid fa-triangle-exclamation text-rose-500 text-sm"></i>
                <span class="text-xs font-bold text-rose-400 uppercase">Awas Bahaya!</span>
            </div>

            <!-- Right Info: Timer & Fog-of-War Minimap -->
            <div class="flex flex-col items-end gap-3 pointer-events-auto">
                <div class="flex gap-2">
                    <button id="btn-pause" class="glass-panel px-3 py-2 rounded-2xl text-stone-200 hover:text-amber-400 text-sm">
                        <i class="fa-solid fa-pause"></i>
                    </button>
                    <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-2">
                        <i class="fa-regular fa-clock text-amber-400"></i>
                        <span id="hud-timer" class="text-base md:text-lg font-cinzel font-bold text-stone-100">00:00</span>
                    </div>
                </div>

                <!-- Minimap -->
                <div class="relative">
                    <canvas id="minimap-canvas" width="110" height="110"></canvas>
                </div>
            </div>
        </div>

        <!-- TOUCH CONTROLS FOR MOBILE -->
        <div id="touch-controls" class="w-full md:hidden flex justify-between items-end opacity-0 transition-opacity pointer-events-auto pb-2">
            <div class="grid grid-cols-3 gap-1.5 w-44 h-44">
                <div></div>
                <button id="btn-up" class="dpad-btn"><i class="fa-solid fa-arrow-up"></i></button>
                <div></div>
                <button id="btn-left" class="dpad-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <button id="btn-down" class="dpad-btn"><i class="fa-solid fa-arrow-down"></i></button>
                <button id="btn-right" class="dpad-btn"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- MAIN MENU OVERLAY -->
    <div id="menu-screen" class="absolute inset-0 z-30 flex items-center justify-center p-4 bg-stone-950/90 backdrop-blur-md">
        <div class="glass-panel max-w-xl w-full p-6 rounded-3xl text-center border-amber-600/40 relative flex flex-col max-h-[90vh]">
            
            <div class="mb-3">
                <div class="inline-block p-3 bg-amber-500/10 rounded-2xl border border-amber-500/30 mb-2">
                    <i class="fa-solid fa-compass text-4xl text-amber-500"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-cinzel font-black text-amber-500 tracking-wider uppercase">
                    EASZGAME: MAZE SAGA
                </h1>
                <p class="text-xs font-cinzel text-stone-400 font-bold uppercase tracking-widest">
                    50+ Peringkat Kembara Organik
                </p>
            </div>

            <!-- Level Selector Grid -->
            <div class="flex-1 overflow-y-auto pr-1 my-2">
                <div id="level-grid" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-2 text-center p-1">
                    <!-- Dynamic Level Cards JS -->
                </div>
            </div>

            <!-- Bottom Menu Actions -->
            <div class="pt-3 border-t border-stone-800 flex justify-between items-center text-xs text-stone-400">
                <div>
                    Jumlah Bintang: <span id="total-stars" class="font-bold text-amber-400">0</span> ★
                </div>
                <button id="btn-continue" class="py-2.5 px-6 rounded-xl font-cinzel font-bold text-slate-950 uppercase btn-organic text-sm">
                    SAMBUNG PERINGKAT
                </button>
            </div>
        </div>
    </div>

    <!-- VICTORY OVERLAY -->
    <div id="victory-screen" class="absolute inset-0 z-30 hidden flex items-center justify-center p-4 bg-stone-950/90 backdrop-blur-md">
        <div class="glass-panel max-w-md w-full p-6 rounded-3xl text-center border-amber-500 relative">
            
            <div class="inline-block p-4 bg-amber-500/10 rounded-full border border-amber-500/40 mb-2 animate-bounce">
                <i class="fa-solid fa-trophy text-4xl text-amber-400"></i>
            </div>

            <h2 class="text-3xl font-cinzel font-black text-amber-400 tracking-wider mb-1 uppercase">
                TAHNIAH!
            </h2>
            <p id="victory-subtitle" class="text-stone-300 text-xs mb-4 font-semibold">Peringkat Berjaya Diselesaikan!</p>

            <!-- Stars Rating -->
            <div id="stars-container" class="flex justify-center gap-2 text-2xl text-amber-400 mb-4">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
            </div>

            <div class="bg-stone-900/80 rounded-2xl p-3 text-center border border-stone-800 mb-6 space-y-1">
                <div class="text-[11px] text-stone-400 uppercase font-bold">Masa Penyelesaian</div>
                <div id="final-time" class="text-2xl font-cinzel font-black text-stone-100">00:00</div>
            </div>

            <div class="flex gap-3">
                <button id="btn-next-level" class="flex-1 py-3 rounded-xl font-cinzel font-bold text-slate-950 uppercase tracking-wider btn-organic text-sm">
                    SETERUSNYA
                </button>
                <button id="btn-menu" class="py-3 px-4 bg-stone-800 hover:bg-stone-700 rounded-xl font-cinzel font-bold text-stone-200 text-sm">
                    SENARAI
                </button>
            </div>
        </div>
    </div>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        // ==========================================
        // 1. PROCEDURAL WEB AUDIO SYNTHESIZER
        // ==========================================
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playStep() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140 + Math.random() * 20, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playPickup() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.18);
            }

            playTrapHit() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.2);
            }

            playVictory() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        const audio = new SoundFX();

        // ==========================================
        // 2. REALM & LEVEL SCALING CONFIG
        // ==========================================
        const REALMS = [
            {
                name: 'Kuil Purba',
                icon: 'fa-synagogue',
                wallColor: 0x44403c,
                floorColor: 0x1c1917,
                fogColor: 0x0c0a09,
                lightColor: 0xf59e0b,
                keyColor: 0xfbbf24
            },
            {
                name: 'Gua Kristal',
                icon: 'fa-gem',
                wallColor: 0x312e81,
                floorColor: 0x0f172a,
                fogColor: 0x09090b,
                lightColor: 0x818cf8,
                keyColor: 0xc084fc
            },
            {
                name: 'Terumbu Karang',
                icon: 'fa-water',
                wallColor: 0x064e3b,
                floorColor: 0x022c22,
                fogColor: 0x021d17,
                lightColor: 0x2dd4bf,
                keyColor: 0x38bdf8
            },
            {
                name: 'Gunung Berapi',
                icon: 'fa-volcano',
                wallColor: 0x450a0a,
                floorColor: 0x180808,
                fogColor: 0x0a0303,
                lightColor: 0xf97316,
                keyColor: 0xef4444
            },
            {
                name: 'Istana Awan',
                icon: 'fa-cloud-sun',
                wallColor: 0x701a75,
                floorColor: 0x2e1065,
                fogColor: 0x110620,
                lightColor: 0xf472b6,
                keyColor: 0xfacc15
            }
        ];

        function getLevelConfig(levelNum) {
            const realmIdx = Math.floor((levelNum - 1) / 10) % REALMS.length;
            const realm = REALMS[realmIdx];

            // Size scaling from 7x7 (Level 1) up to 29x29+ (Level 50+)
            const baseSize = 7 + Math.floor((levelNum - 1) * 0.44);
            const size = baseSize % 2 === 0 ? baseSize + 1 : baseSize;

            // Required keys scaling
            let keysCount = 1;
            if (levelNum > 10 && levelNum <= 25) keysCount = 2;
            else if (levelNum > 25 && levelNum <= 40) keysCount = 3;
            else if (levelNum > 40) keysCount = 4 + Math.floor((levelNum - 40) / 5);

            // Dynamic Hazards Count starting Level 10 onwards
            const hazardsCount = levelNum >= 10 ? Math.min(8, Math.floor((levelNum - 8) / 4)) : 0;

            return { levelNum, realm, size, keysCount, hazardsCount };
        }

        // Save & Load Progress
        let userProgress = JSON.parse(localStorage.getItem('easzgame_saga_progress')) || {
            unlockedLevel: 1,
            stars: {}
        };

        function saveProgress() {
            localStorage.setItem('easzgame_saga_progress', JSON.stringify(userProgress));
        }

        // ==========================================
        // 3. RECURSIVE BACKTRACKER MAZE GENERATOR
        // ==========================================
        function generateMaze(size) {
            const width = size;
            const height = size;
            const grid = Array(height).fill().map(() => Array(width).fill(1)); // 1 = Wall, 0 = Path

            function walk(x, y) {
                grid[y][x] = 0;
                const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);

                for (let [dx, dy] of dirs) {
                    const nx = x + dx;
                    const ny = y + dy;

                    if (nx > 0 && nx < width - 1 && ny > 0 && ny < height - 1 && grid[ny][nx] === 1) {
                        grid[y + dy / 2][x + dx / 2] = 0;
                        walk(nx, ny);
                    }
                }
            }

            walk(1, 1);
            return { grid, width, height };
        }

        // ==========================================
        // 4. GAME ENGINE & STATE
        // ==========================================
        let currentLevel = 1;
        let isPlaying = false;
        let mazeData = null;
        let fogGrid = []; // Fog of War tracking
        let itemsTotal = 1;
        let itemsCollected = 0;
        let timerSeconds = 0;
        let timerInterval = null;

        let scene, camera, renderer;
        let playerMesh, exitPortalMesh;
        let wallMeshes = [], itemMeshes = [], hazardMeshes = [], particles = [];

        const playerPos = { x: 1, z: 1 };
        const keys = { up: false, down: false, left: false, right: false };

        const minimapCanvas = document.getElementById('minimap-canvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        function initScene() {
            const container = document.getElementById('game-canvas');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
            renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            window.addEventListener('resize', onWindowResize);
        }

        function buildLevelWorld(levelNum) {
            const config = getLevelConfig(levelNum);
            const realm = config.realm;

            // Clear Scene Objects
            wallMeshes.forEach(w => scene.remove(w));
            itemMeshes.forEach(i => scene.remove(i));
            hazardMeshes.forEach(h => scene.remove(h.mesh));
            particles.forEach(p => scene.remove(p));
            if (playerMesh) scene.remove(playerMesh);
            if (exitPortalMesh) scene.remove(exitPortalMesh);

            wallMeshes = []; itemMeshes = []; hazardMeshes = []; particles = [];

            scene.background = new THREE.Color(realm.fogColor);
            scene.fog = new THREE.FogExp2(realm.fogColor, 0.035);

            // Lights
            scene.children.filter(c => c.isLight).forEach(l => scene.remove(l));
            const ambient = new THREE.AmbientLight(0xffffff, 0.45);
            scene.add(ambient);

            const realmLight = new THREE.PointLight(realm.lightColor, 2, 40);
            realmLight.position.set(0, 12, 0);
            scene.add(realmLight);

            // Generate Maze
            mazeData = generateMaze(config.size);
            const { grid, width, height } = mazeData;

            // Initialize Fog of War Grid (false = unexplored)
            fogGrid = Array(height).fill().map(() => Array(width).fill(false));
            revealFog(1, 1);

            // World Meshes Construction
            const wallGeo = new THREE.BoxGeometry(2, 2.6, 2);
            const wallMat = new THREE.MeshStandardMaterial({
                color: realm.wallColor,
                roughness: 0.75,
                metalness: 0.2,
                flatShading: true
            });

            const floorGeo = new THREE.PlaneGeometry(width * 2, height * 2);
            floorGeo.rotateX(-Math.PI / 2);
            const floorMat = new THREE.MeshStandardMaterial({ color: realm.floorColor, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.set(width - 1, 0, height - 1);
            scene.add(floor);

            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    if (grid[r][c] === 1) {
                        const wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(c * 2, 1.3, r * 2);
                        scene.add(wall);
                        wallMeshes.push(wall);
                    }
                }
            }

            // Player Avatar
            const playerGeo = new THREE.DodecahedronGeometry(0.55, 1);
            const playerMat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                emissive: 0xd97706,
                emissiveIntensity: 0.6,
                roughness: 0.2
            });
            playerMesh = new THREE.Mesh(playerGeo, playerMat);
            playerPos.x = 1;
            playerPos.z = 1;
            playerMesh.position.set(2, 0.65, 2);
            scene.add(playerMesh);

            const pLight = new THREE.PointLight(0xfbbf24, 1.8, 10);
            playerMesh.add(pLight);

            // Items Placement
            itemsTotal = config.keysCount;
            itemsCollected = 0;
            let pathPositions = [];

            for (let r = 1; r < height - 1; r++) {
                for (let c = 1; c < width - 1; c++) {
                    if (grid[r][c] === 0 && !(r === 1 && c === 1)) {
                        pathPositions.push({ r, c });
                    }
                }
            }

            pathPositions.sort(() => Math.random() - 0.5);

            for (let i = 0; i < itemsTotal; i++) {
                const pt = pathPositions.pop();
                const keyGeo = new THREE.OctahedronGeometry(0.45, 0);
                const keyMat = new THREE.MeshStandardMaterial({
                    color: realm.keyColor,
                    emissive: realm.keyColor,
                    emissiveIntensity: 0.8
                });
                const keyMesh = new THREE.Mesh(keyGeo, keyMat);
                keyMesh.position.set(pt.c * 2, 0.75, pt.r * 2);
                keyMesh.userData = { gridX: pt.c, gridZ: pt.r };
                scene.add(keyMesh);
                itemMeshes.push(keyMesh);
            }

            // Hazards / Moving Block Traps
            if (config.hazardsCount > 0) {
                document.getElementById('hazard-warning').classList.remove('hidden');
                for (let i = 0; i < config.hazardsCount; i++) {
                    if (pathPositions.length === 0) break;
                    const pt = pathPositions.pop();
                    const hazGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                    const hazMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xb91c1c });
                    const hazMesh = new THREE.Mesh(hazGeo, hazMat);
                    hazMesh.position.set(pt.c * 2, 0.6, pt.r * 2);
                    scene.add(hazMesh);
                    hazardMeshes.push({
                        mesh: hazMesh,
                        gridX: pt.c,
                        gridZ: pt.r,
                        dir: Math.random() > 0.5 ? 1 : -1,
                        axis: Math.random() > 0.5 ? 'x' : 'z'
                    });
                }
            } else {
                document.getElementById('hazard-warning').classList.add('hidden');
            }

            // Exit Arch Portal
            const exitX = width - 2;
            const exitZ = height - 2;
            grid[exitZ][exitX] = 0;

            const portalGeo = new THREE.TorusGeometry(0.85, 0.18, 16, 32);
            const portalMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, wireframe: true });
            exitPortalMesh = new THREE.Mesh(portalGeo, portalMat);
            exitPortalMesh.position.set(exitX * 2, 1.3, exitZ * 2);
            scene.add(exitPortalMesh);

            // Floating Atmosphere Particles
            for (let i = 0; i < 45; i++) {
                const pGeo = new THREE.SphereGeometry(0.08, 6, 6);
                const pMat = new THREE.MeshBasicMaterial({ color: realm.lightColor, transparent: true, opacity: 0.65 });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set(
                    Math.random() * width * 2,
                    Math.random() * 4 + 0.5,
                    Math.random() * height * 2
                );
                p.userData = { velY: (Math.random() - 0.5) * 0.4 };
                scene.add(p);
                particles.push(p);
            }

            // UI HUD Update
            document.getElementById('hud-level-title').innerText = `PERINGKAT ${levelNum}`;
            document.getElementById('hud-realm-name').innerText = realm.name;
            document.getElementById('theme-icon').className = `fa-solid ${realm.icon} text-amber-500 text-xl`;
            document.getElementById('hud-items-collected').innerText = '0';
            document.getElementById('hud-items-total').innerText = itemsTotal;
        }

        function revealFog(x, z) {
            const radius = 2;
            for (let r = -radius; r <= radius; r++) {
                for (let c = -radius; c <= radius; c++) {
                    const nx = x + c;
                    const nz = z + r;
                    if (mazeData && nz >= 0 && nz < mazeData.height && nx >= 0 && nx < mazeData.width) {
                        fogGrid[nz][nx] = true;
                    }
                }
            }
        }

        // ==========================================
        // 5. INPUT & CONTROLS
        // ==========================================
        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            });

            const bindTouch = (id, keyName) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            };

            bindTouch('btn-up', 'up');
            bindTouch('btn-down', 'down');
            bindTouch('btn-left', 'left');
            bindTouch('btn-right', 'right');

            document.getElementById('btn-continue').addEventListener('click', () => {
                startLevel(userProgress.unlockedLevel);
            });

            document.getElementById('btn-next-level').addEventListener('click', () => {
                startLevel(currentLevel + 1);
            });

            document.getElementById('btn-menu').addEventListener('click', showMenu);
            document.getElementById('btn-pause').addEventListener('click', showMenu);
        }

        function renderLevelGridUI() {
            const gridEl = document.getElementById('level-grid');
            gridEl.innerHTML = '';

            let totalStars = 0;

            for (let i = 1; i <= 50; i++) {
                const isUnlocked = i <= userProgress.unlockedLevel;
                const starsCount = userProgress.stars[i] || 0;
                totalStars += starsCount;

                const card = document.createElement('button');
                card.className = `level-card p-2 rounded-xl text-center border font-cinzel font-bold flex flex-col items-center justify-between h-16 ${
                    isUnlocked 
                    ? 'bg-stone-900 border-amber-600/50 text-amber-400 cursor-pointer' 
                    : 'bg-stone-950/60 border-stone-800 text-stone-600 locked cursor-not-allowed'
                }`;

                let starsHtml = '';
                if (isUnlocked) {
                    for (let s = 1; s <= 3; s++) {
                        starsHtml += `<i class="fa-solid fa-star ${s <= starsCount ? 'text-amber-400' : 'text-stone-700'} text-[10px]"></i>`;
                    }
                } else {
                    starsHtml = '<i class="fa-solid fa-lock text-stone-700 text-xs"></i>';
                }

                card.innerHTML = `
                    <div class="text-xs">Lvl ${i}</div>
                    <div class="flex gap-0.5">${starsHtml}</div>
                `;

                if (isUnlocked) {
                    card.addEventListener('click', () => startLevel(i));
                }

                gridEl.appendChild(card);
            }

            document.getElementById('total-stars').innerText = totalStars;
        }

        function showMenu() {
            isPlaying = false;
            clearInterval(timerInterval);
            renderLevelGridUI();
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('hud').classList.add('opacity-0');
            document.getElementById('touch-controls').classList.add('opacity-0');
        }

        // ==========================================
        // 6. GAME UPDATES & MINIMAP
        // ==========================================
        function startLevel(lvlNum) {
            audio.init();
            currentLevel = lvlNum;
            buildLevelWorld(currentLevel);

            timerSeconds = 0;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPlaying) {
                    timerSeconds++;
                    const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                    const s = String(timerSeconds % 60).padStart(2, '0');
                    document.getElementById('hud-timer').innerText = `${m}:${s}`;
                }
            }, 1000);

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('opacity-0');
            document.getElementById('touch-controls').classList.remove('opacity-0');

            isPlaying = true;
        }

        let moveCooldown = 0;

        function updateMovement(delta) {
            if (!isPlaying || !mazeData) return;

            moveCooldown -= delta;
            let targetX = playerPos.x;
            let targetZ = playerPos.z;

            if (moveCooldown <= 0) {
                if (keys.up) targetZ -= 1;
                else if (keys.down) targetZ += 1;
                else if (keys.left) targetX -= 1;
                else if (keys.right) targetX += 1;

                if (targetX !== playerPos.x || targetZ !== playerPos.z) {
                    if (mazeData.grid[targetZ] && mazeData.grid[targetZ][targetX] === 0) {
                        playerPos.x = targetX;
                        playerPos.z = targetZ;
                        moveCooldown = 0.15;
                        revealFog(playerPos.x, playerPos.z);
                        audio.playStep();
                    }
                }
            }

            // Interpolate Mesh Position
            const target3D = new THREE.Vector3(playerPos.x * 2, 0.65, playerPos.z * 2);
            playerMesh.position.lerp(target3D, 18 * delta);
            playerMesh.rotation.y += 2 * delta;

            // Camera Following
            camera.position.x = playerMesh.position.x;
            camera.position.z = playerMesh.position.z + 7.5;
            camera.position.y = 8.5;
            camera.lookAt(playerMesh.position.x, 0.6, playerMesh.position.z);

            // Item Pickups Check
            for (let i = itemMeshes.length - 1; i >= 0; i--) {
                const item = itemMeshes[i];
                item.rotation.y += 3 * delta;

                if (item.userData.gridX === playerPos.x && item.userData.gridZ === playerPos.z) {
                    audio.playPickup();
                    scene.remove(item);
                    itemMeshes.splice(i, 1);
                    itemsCollected++;
                    document.getElementById('hud-items-collected').innerText = itemsCollected;
                }
            }

            // Dynamic Hazards Logic
            hazardMeshes.forEach(haz => {
                if (haz.axis === 'x') {
                    haz.mesh.position.x += haz.dir * 3 * delta;
                    if (Math.abs(haz.mesh.position.x - haz.gridX * 2) > 1.8) haz.dir *= -1;
                } else {
                    haz.mesh.position.z += haz.dir * 3 * delta;
                    if (Math.abs(haz.mesh.position.z - haz.gridZ * 2) > 1.8) haz.dir *= -1;
                }

                // Check collision with hazard
                if (playerMesh.position.distanceTo(haz.mesh.position) < 1.0) {
                    audio.playTrapHit();
                    // Reset Player to start
                    playerPos.x = 1;
                    playerPos.z = 1;
                    revealFog(1, 1);
                }
            });

            // Exit Portal Check
            const exitX = mazeData.width - 2;
            const exitZ = mazeData.height - 2;
            if (playerPos.x === exitX && playerPos.z === exitZ && itemsCollected >= itemsTotal) {
                levelComplete();
            }
        }

        function levelComplete() {
            isPlaying = false;
            audio.playVictory();
            clearInterval(timerInterval);

            // Calculate Stars based on time
            let stars = 1;
            if (timerSeconds <= 45) stars = 3;
            else if (timerSeconds <= 90) stars = 2;

            // Save Progress
            if (userProgress.unlockedLevel === currentLevel) {
                userProgress.unlockedLevel = Math.min(50, currentLevel + 1);
            }
            userProgress.stars[currentLevel] = Math.max(userProgress.stars[currentLevel] || 0, stars);
            saveProgress();

            // Render Stars UI
            const starsContainer = document.getElementById('stars-container');
            starsContainer.innerHTML = '';
            for (let s = 1; s <= 3; s++) {
                starsContainer.innerHTML += `<i class="fa-solid fa-star ${s <= stars ? 'text-amber-400' : 'text-stone-700'}"></i>`;
            }

            document.getElementById('final-time').innerText = document.getElementById('hud-timer').innerText;
            document.getElementById('victory-screen').classList.remove('hidden');
        }

        function drawMinimap() {
            if (!mazeData) return;
            const { grid, width, height } = mazeData;

            minimapCtx.clearRect(0, 0, 110, 110);
            const cellSize = 110 / width;

            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    if (!fogGrid[r][c]) {
                        // Unexplored Fog
                        minimapCtx.fillStyle = '#09090b';
                        minimapCtx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    } else if (grid[r][c] === 1) {
                        // Wall
                        minimapCtx.fillStyle = '#44403c';
                        minimapCtx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    } else {
                        // Path
                        minimapCtx.fillStyle = '#1c1917';
                        minimapCtx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    }
                }
            }

            // Draw Exit
            if (fogGrid[height - 2][width - 2]) {
                minimapCtx.fillStyle = '#22c55e';
                minimapCtx.fillRect((width - 2) * cellSize, (height - 2) * cellSize, cellSize, cellSize);
            }

            // Draw Items
            minimapCtx.fillStyle = '#fbbf24';
            itemMeshes.forEach(item => {
                if (fogGrid[item.userData.gridZ][item.userData.gridX]) {
                    minimapCtx.beginPath();
                    minimapCtx.arc(
                        (item.userData.gridX + 0.5) * cellSize,
                        (item.userData.gridZ + 0.5) * cellSize,
                        cellSize * 0.35, 0, Math.PI * 2
                    );
                    minimapCtx.fill();
                }
            });

            // Draw Player Position
            minimapCtx.fillStyle = '#f59e0b';
            minimapCtx.beginPath();
            minimapCtx.arc(
                (playerPos.x + 0.5) * cellSize,
                (playerPos.z + 0.5) * cellSize,
                cellSize * 0.45, 0, Math.PI * 2
            );
            minimapCtx.fill();
        }

        // ==========================================
        // 7. ANIMATION LOOP
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            updateMovement(delta);
            drawMinimap();

            particles.forEach(p => {
                p.position.y += p.userData.velY * delta;
                if (p.position.y > 4.5 || p.position.y < 0.5) p.userData.velY *= -1;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            initScene();
            setupControls();
            renderLevelGridUI();
            animate();
        };
    </script>
</body>
